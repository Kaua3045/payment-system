global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464'] # Raspa métricas somente do OTEL Collector

  - job_name: 'postgres-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']