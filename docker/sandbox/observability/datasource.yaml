apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false

  - name: PostgreSQL
    type: postgres
    uid: postgresql
    access: proxy
    url: payment-system-db:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: payment-system
      sslmode: 'disable'
      postgresVersion: 1700
    editable: false