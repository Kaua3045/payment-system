application:
  otel:
    memory-exporter: false
  name: payment-system
  environment: ${DEPLOYMENT_ENVIRONMENT_NAME:dev}
  instance: payment-system-01

idempotency-key:
  storage:
    type: redis

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

spring:
  datasource: # change this configurations to your database
    url: jdbc:postgresql://${POSTGRES_URL}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    redis:
      enabled: false

opentelemetry:
  metrics:
    #    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT} # For Production
    endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4317/v1/metrics}